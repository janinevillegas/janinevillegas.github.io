    <h1>Contact Me</h1>
    <hr style="border: 0; height: 2px; background-color: #63214e; width: 5%;">
    <div class="container">
        <form action="https://formspree.io/f/mljrbkyr" method="POST">

            <label for="fname">First Name</label>
            <input type="text" id="fname" name="firstname">

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lastname">

            <label for="email">Email</label>
            <input type="email" id="email" name="email">

            <label for="subject">Subject</label>
            <textarea id="subject" name="subject"></textarea>

            <label for="body">Body</label>
            <textarea id="body" name="body" style="height:200px"></textarea>

            <input type="submit" value="Submit">

        </form>
    </div>
    <footer>
        <div class="footer-container">
            <a href="https://github.com/janinevillegas" target="_blank" rel="noopener">
            <img src="github.png" alt="Visit my GitHub profile">
            </a>

            <a href="https://www.linkedin.com/in/janine-villegas/" target="_blank" rel="noopener">
            <img src="linkedin.png" alt="Connect with me on LinkedIn">
            </a>

        </div>
    </footer>
    
    <script>
        document.querySelector("form").addEventListener("submit", function(event) {
            event.preventDefault();

            const form = this;

            fetch(form.action, {
                method: "POST",
                body: new FormData(form),
                headers: {
                    "Accept": "application/json"
                }
            })
            .then(response => {
                if (response.ok) {
                    alert("Email received!");
                    form.reset();
                    location.reload();
                } else {
                    alert("Something went wrong. Please try again.");
                }
            })
            .catch(error => {
                alert("Something went wrong. Please try again.");
            });
        });
    </script>
</body>
